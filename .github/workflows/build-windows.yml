name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach binaries to (e.g. v2.16.0)'
        required: true
        default: 'v2.16.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows assets
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || 'v2.16.0' }}"
          VER="${TAG#v}"
          mkdir -p dist
          cp target/release/ag_unlocker.exe "dist/AG_${VER}.exe"
          cp target/release/ag_unlocker.exe dist/ag_unlocker.exe
          cd dist
          7z a "antigravity-unlocker-windows-x86_64.zip" "AG_${VER}.exe" ag_unlocker.exe ../icon.ico

      - name: Upload Windows assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || 'v2.16.0' }}"
          VER="${TAG#v}"
          gh release upload "$TAG" \
            "dist/AG_${VER}.exe" \
            dist/ag_unlocker.exe \
            dist/antigravity-unlocker-windows-x86_64.zip \
            --clobber
